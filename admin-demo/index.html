$('#hd').innerHTML=`<div style="display:flex;gap:10px;align-items:center"><button class="ib" id="mb" aria-label="Menu">☰</button><div><b style="font-size:18px">Good morning, Priya 👋</b><div class="mut">Sunshine Kids Preschool</div></div></div><div class="r"><input class="in" id="q" placeholder="Search children, parents, teachers…" aria-label="Global search" value="${S.q}" style="width:230px"><div class="chips" style="margin:0;gap:0" role="group" aria-label="Theme"><button class="chip ${TH=='light'?'on':''}" data-th="light" style="border-radius:99px 0 0 99px">☀️ Light</button><button class="chip ${TH=='dark'?'on':''}" data-th="dark" style="border-radius:0 99px 99px 0">🌙 Dark</button></div><button class="ib" data-p="n" aria-label="Notifications">🔔</button><button class="ib" data-h="1" aria-label="Help">?</button><select id="ct" aria-label="Centre">${['Satellite','Vastrapur','Maninagar'].map(c=>`<option ${c==S.ctr?'selected':''}>${c}</option>`).join('')}</select><div class="av">PS</div>${pop()}</div>`;}
function pop(){if(S.pop=='n')return`<div class="pop">${[['attendance','🔴 3 children absent without reason'],['observations','🟡 4 observations pending'],['pickup','🔵 2 pickup exceptions'],['fees','🟡 5 fee payments overdue']].map(n=>`<a data-g="${n[0]}">${n[1]}</a>`).join('')}</div>`;
if(S.q){const q=S.q.toLowerCase(),r=K.filter(k=>(k.n+k.par).toLowerCase().includes(q)).map(k=>`<a data-g="child/${k.id}"><b>${k.n}</b><div class="mut">${k.cl.n} · Parent: ${k.par}</div></a>`).concat(TC.filter(t=>t[0].toLowerCase().includes(q)).map(t=>`<a data-g="teachers"><b>${t[0]}</b><div class="mut">Teacher · ${t[1]}</div></a>`),CL.filter(c=>c.n.toLowerCase().includes(q)).map(c=>`<a data-g="classes"><b>${c.n}</b><div class="mut">Class</div></a>`));return`<div class="pop">${r.join('')||empty('🔍','No results for “'+S.q+'”')}</div>`}return''}
const KI={'Children':'🧒',"Today's Journey":'🌤️','Parent Engagement':'💌','Fees':'🪙','Learning':'🌱','Present':'😊','Absent':'🤒','Late':'⏰','Unmarked':'❔','Expected':'🚌','Completed':'🏠','Waiting':'⏳','Exceptions':'🚩'};
function kpi(l,v,s,c){return`<div class="cd" style="background:var(${c})"><div class="mut"><b>${KI[l]||''} ${l}</b></div><div class="big">${v}</div><div class="mut">${s}</div></div>`}
function ribbon(){return`<div class="cd h" data-g="journey"><h2>Today's Child Journey</h2><div class="mut">See how the children experienced their day. Tap to open every class.</div><div class="jr">${ST.map((s,i)=>`<div class="js"><div class="ic">${["🚪","🎶","📚","🍎","🎨","🍱","😴","🧩","🚌"][i]}</div><div class="bar"><b style="height:${Math.max(SP[i],3)}%;background:var(${COL[i%5]})"></b></div><div class="pc">${SP[i]}%</div><div class="nm">${s}</div></div>`).join('')}</div></div>`}
function classCard(c){return`<div class="cd h" data-g="classes"><div style="display:flex;justify-content:space-between"><h3>${c.n}</h3>${pill(Math.round(c.p/c.c*100)+'% in')}</div><div class="mut">${c.t} · ${c.p} of ${c.c} present</div><p>Now: <b>${c.a}</b></p><div class="mut">Journey ${c.j}% complete</div>${bar(c.j)}<p><button class="btn s" data-g="journey" data-cl="${c.id}">View Class</button></p></div>`}
const V={
overview:()=>`<div class="hero"><h1>Good morning, Priya 👋</h1><p>Here's what's happening at Sunshine Kids today.<br><b>Monday, October 6, 2026</b></p><span class="a">☀️</span><span class="b">🌈</span><span class="c">🔤🧸🔢</span></div>`+`<div class="g k5">${kpi('Children','124','112 present · 90.3% attendance','--blue')}${kpi('Today\'s Journey','87%','108 of 124 children','--mint')}${kpi('Parent Engagement','87%','This week','--lav')}${kpi('Fees','₹2,84,000','Collected · ₹42,000 outstanding','--yel')}${kpi('Learning','18','Activities today · 4 observations pending','--peach')}</div><br>${ribbon()}<br><div class="g k2"><div class="cd"><h2>What's happening today?</h2><br><div class="tl">${FD.map(f=>`<div class="ti"><b>${f[0]}</b><div>${f[1]}</div></div>`).join('')}</div></div><div class="cd"><h2>Needs Attention</h2><br>${[['🔴','3 children absent without reason','Review attendance','attendance'],['🟡','4 observations pending','Review observations','observations'],['🟡','5 overdue fee payments','View fees','fees'],['🔵','2 pickup exceptions','Review pickup','pickup']].map(a=>`<div class="at" data-g="${a[3]}"><span>${a[0]} <b>${a[1]}</b></span><span class="btn s">${a[2]}</span></div>`).join('')}</div></div><br><h2>Classes Today</h2><br><div class="g k3">${CL.map(classCard).join('')}</div>`,
children:()=>{const l=K.filter(k=>(S.cl=='all'||k.cl.id==S.cl)&&(k.n+k.par).toLowerCase().includes(S.fq.toLowerCase()));return hdr('Children','Manage every child\'s preschool journey.',`<button class="btn" onclick="toast('Export ready (demo)')">Export</button> <button class="btn p" id="add">Add Child</button>`)+`<div class="chips"><input class="in" id="fq" placeholder="Search children" aria-label="Filter children" value="${S.fq}">${chips()}</div><div class="cd tw">${l.length?`<table><tr><th>Child<th>Class<th>Age<th>Attendance<th>Journey<th>Parent<th>Fees<th>Status</tr>${l.map(k=>`<tr class="rw" data-g="child/${k.id}"><td><b>${k.an} ${k.n}</b><td>${k.cl.n}<td>${k.age}<td>${pill(k.at)}<td>${k.j}%<td>${k.par}<td>${pill(k.fee)}<td>Active</tr>`).join('')}</table>`:empty('🧒','No children match your filters')}</div>`},
child:(id)=>{const k=K[id-1]||K[0],t=S.tab;let b='';
if(t=='overview')b=`<div class="g k3"><div class="cd"><h3>Today's Status</h3><p>${pill(k.at)}</p><p>Arrival: <b>08:55 AM</b><br>Current activity: <b>Creative Learning</b><br>Pickup: <b>${k.pk}</b></p></div><div class="cd"><h3>Journey completion</h3><div class="big">${k.j}%</div>${bar(k.j,'--ok')}</div><div class="cd"><h3>Family</h3><p>${k.par}<br><span class="mut">${k.ph}</span></p><p>Parent engagement: <b>92%</b></p></div></div>`;
else if(t=='journey')b=`<div class="cd"><h2>${k.n.split(' ')[0]}'s Day</h2><br><div class="tl">${[['08:55 AM','Arrived','Checked in by Teacher Priya'],['09:30 AM','Circle Time','Hello Song + Greetings'],['10:00 AM','Learning Activity — Colour Recognition','','Correctly identified red, blue and yellow independently.'],['10:30 AM','Snack','Completed'],['11:15 AM','Phonics — Letter B','','Recognized the letter B with visual support.'],['12:20 PM','Lunch','Completed'],['01:00 PM','Nap','Duration: 52 minutes'],['03:00 PM','Music & Movement','Completed'],['04:05 PM','Pickup','Waiting for authorized pickup',,1]].map(e=>`<div class="ti ${e[4]?'w':''}"><b>${e[0]}</b> · ${e[1]}<div class="mut">${e[2]||''}</div>${e[3]?`<q>${e[3]}</q>`:''}</div>`).join('')}</div></div>`;
else if(t=='learning')b=obsList(OB.filter(o=>o.k==k.id));
else if(t=='portfolio')b=pfGrid(PF.filter(p=>p.k==k.id));
else if(t=='pickup')b=pkCard(k);
else b=`<div class="cd">${empty('📁',t[0].toUpperCase()+t.slice(1)+' details will appear here in the full product')}</div>`;
return`<div class="cd" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="av" style="width:72px;height:72px;font-size:26px;background:var(--mint);font-size:42px">${k.an}</div><div style="flex:1"><h1>${k.n}</h1><div class="mut">${k.cl.n} · ${k.age.replace('y',' years ').replace('m',' months')}</div><p style="margin:8px 0 0">${pill(k.at)} ${pill('Journey '+k.j+'%')} ${pill('Engagement 92%')} ${pill('Fees '+k.fee)} ${pill('Pickup authorized')}</p></div><button class="btn" data-g="children">← Children</button></div><div class="tabs" role="tablist">${['overview','journey','learning','portfolio','attendance','fees','family','pickup','documents','history'].map(x=>`<button class="tab ${x==t?'on':''}" data-t="${x}">${{journey:"Today's Journey",history:'Activity History'}[x]||x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${b}`},
journey:()=>{const l=K.filter(k=>S.cl=='all'||k.cl.id==S.cl);const ic=(k,i)=>{const p=Math.round(k.j/100*8);return k.at=='Absent'?(i==0?'<b class="na" title="Needs attention">⚠</b>':'<span class="ns">○</span>'):i<p?'<b class="ok">✓</b>':i==p?'<b class="ip">●</b>':'<span class="ns">○</span>'};
return hdr('Today\'s Journey','Track every child\'s day from arrival to pickup.',`<div class="big">87%</div><div class="mut">Overall completion</div>`)+`<div class="chips">${chips()}</div><div class="cd tw"><table><tr><th>Child<th>Arrival<th>Activity<th>Meal<th>Nap<th>Learning<th>Photo<th>Pickup</tr>${l.map(k=>`<tr class="rw" data-g="child/${k.id}"><td><b>${k.an} ${k.n}</b><div class="mut">${k.cl.n}</div>${[0,2,3,6,2,4,8].map(i=>`<td>${ic(k,i)}`).join('')}</tr>`).join('')}</table><p class="mut">✓ Completed · ● In progress · ○ Not started · ⚠ Needs attention</p></div>`},
attendance:()=>{const c=x=>K.filter(k=>k.at==x).length+({Present:100,Absent:6,Late:1}[x]||0);return hdr('Attendance','Monday, October 6, 2026')+`<div class="g k5">${kpi('Present',c('Present'),'','--mint')}${kpi('Absent',c('Absent'),'','--peach')}${kpi('Late',c('Late'),'','--yel')}${kpi('Unmarked',0,'','--blue')}</div><br><div class="chips">${chips()}</div><div class="cd tw"><table><tr><th>Child<th>Class<th>Status<th>Reason<th>Mark</tr>${K.filter(k=>S.cl=='all'||k.cl.id==S.cl).map(k=>`<tr><td><b>${k.an} ${k.n}</b><td>${k.cl.n}<td>${pill(k.at)}<td>${k.rs||'—'}<td>${['Present','Absent','Late'].map(s=>`<button class="btn s" data-at="${k.id}|${s}">${s}</button>`).join(' ')}</tr>`).join('')}</table></div>`},
classes:()=>hdr('Classes','Every classroom, live.')+`<div class="g k3">${CL.map(classCard).join('')}</div>`,
teachers:()=>hdr('Teachers','Who is recording the day.')+`<div class="cd tw"><table><tr><th>Teacher<th>Class<th>Attendance<th>Journey<th>Observations<th>Photos<th>Last active</tr>${TC.map(t=>`<tr><td><b>${t[0]}</b><td>${t[1]}<td>${t[2]}%<td>${t[3]}%<td>${t[4]}<td>${t[5]}<td>Just now</tr>`).join('')}</table></div>`,
activities:()=>hdr('Activities','Activity library')+`<div class="g k3">${AD.map((a,i)=>`<div class="cd"><div class="ph" style="background:var(${COL[i%5]})">🎨</div><h3>${a[0]}</h3><div class="mut">${a[1]} · Age ${a[2]} · ${a[3]}<br>Skill: ${a[4]}</div><p><button class="btn s" onclick="toast('${a[0]} started')">Start Activity</button></p></div>`).join('')}</div>`,
observations:()=>hdr('Observations','Developmental notes, not marks.',`<button class="btn p" id="ao">Add observation</button>`)+obsList(OB),
portfolio:()=>hdr('Portfolio','Photo evidence linked to learning.')+pfGrid(PF),
pickup:()=>hdr('Pickup & Safety','Only verified guardians leave with a child.')+`<div class="g k5">${kpi('Expected',118,'','--blue')}${kpi('Completed',64+K.filter(k=>k.pk=='Completed').length*0,'','--mint')}${kpi('Waiting',42,'','--yel')}${kpi('Exceptions',2,'','--peach')}</div><br><div class="g k3">${K.filter(k=>k.at!='Absent').map(pkCard).join('')}</div>`,
fees:()=>hdr('Fees','Collected ₹2,84,000 · Outstanding ₹42,000 · Overdue ₹18,500 · Collection rate 87%')+`<div class="cd tw"><table><tr><th>Child<th>Parent<th>Invoice<th>Amount<th>Due<th>Status<th>Action</tr>${K.map((k,i)=>`<tr><td><b>${k.an} ${k.n}</b><td>${k.par}<td>INV-${2600+i}<td>₹${(8500+i%3*1500).toLocaleString('en-IN')}<td>Oct 10<td>${pill(k.fee)}<td>${k.fee!='Paid'?`<button class="btn s" data-fee="${k.id}">Mark paid</button>`:'—'}</tr>`).join('')}</table></div>`,
families:()=>hdr('Families','Parents and their engagement.')+`<div class="cd tw"><table><tr><th>Parent<th>Child<th>Phone<th>Engagement<th>Last opened</tr>${K.map((k,i)=>`<tr><td><b>${k.par}</b><td>${k.n}<td>${k.ph}<td>${92-i*3}%<td>Today, 10:${42-i} AM</tr>`).join('')}</table></div>`,
messages:()=>hdr('Messages','Announcements, class updates, parent messages.')+`<div class="cd"><h3>Nursery A Parents</h3><p>“Today children enjoyed a colour recognition activity.”</p><button class="btn p" onclick="toast('Update sent to 24 parents')">Send Update</button> <button class="btn" onclick="toast('Scheduled for 5:00 PM')">Schedule</button> <button class="btn" onclick="toast('24 recipients')">View Recipients</button></div>`,
reports:()=>hdr('Reports','Weekly view')+`<div class="g k3">${[['Attendance',90],['Child Journey',87],['Parent Engagement',87],['Observation coverage',78],['Fee collection',87],['Teacher activity',94]].map((r,i)=>`<div class="cd"><h3>${r[0]}</h3><div class="big">${r[1]}%</div>${bar(r[1],COL[i%5])}</div>`).join('')}</div>`,
settings:()=>hdr('Settings','Centre, academic, users and parent experience.')+`<div class="g k3">${[['Centre','Sunshine Kids Preschool, Ahmedabad · 8:30 AM–5:00 PM'],['Academic','6 classes · Year 2026–27'],['Users','2 admins · 12 teachers'],['Parent Experience','Daily digest on · Photos need approval']].map(s=>`<div class="cd"><h3>${s[0]}</h3><p class="mut">${s[1]}</p></div>`).join('')}</div>`
};
function chips(){return`<div class="chips" style="margin:0">${[['all','All classes'],...CL.map(c=>[c.id,c.n])].map(c=>`<button class="chip ${S.cl==c[0]?'on':''}" data-cl="${c[0]}">${c[1]}</button>`).join('')}</div>`}
function obsList(l){return l.length?`<div class="g k3">${l.map(o=>`<div class="cd"><span class="pill p-l">${o.a}</span><h3 style="margin-top:8px">${K[o.k-1].n}</h3><q style="display:block;font-style:italic;quotes:none">${o.t}</q><p class="mut">Evidence: ${o.ev} · ${o.act} · ${o.d} · ${pill('Recorded')}</p></div>`).join('')}</div>`:`<div class="cd">${empty('🌱','No observations yet')}</div>`}
function pfGrid(l){return l.length?`<div class="g k3">${l.map((p,i)=>`<div class="cd"><div class="ph" style="background:var(${COL[(i+p.k)%5]})">${['🎨','🔤','🔢','🧱','🎵','📖'][i%6]}</div><h3>${p.act}</h3><div class="mut">${K[p.k-1].n} · ${p.t} · Oct 6</div><p>${p.ok?pill('Parent-visible'):`<button class="btn s" data-ph="${PF.indexOf(p)}">Approve</button>`}</p></div>`).join('')}</div>`:`<div class="cd">${empty('📷','No photos yet')}</div>`}
function pkCard(k){return`<div class="cd"><h3>${k.n}</h3><div class="mut">Authorized: <b>${k.par}</b> · ${['Father','Mother'][k.id%2]}</div><p>${pill(k.pk)} ${k.vf?pill('Verified'):''}</p><button class="btn s" data-vf="${k.id}">Verify</button> <button class="btn s p" data-pk="${k.id}">Complete Pickup</button></div>`}
function render(){const [p,id]=cur();shell();$('#v').innerHTML=(V[p]||V.overview)(id);document.title='Preschool OS — Admin Demo'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-th],[data-g],[data-c],[data-h],[data-p],[data-t],[data-cl],[data-at],[data-fee],[data-vf],[data-pk],[data-ph],#add,#ao,#mb');if(!t){if(S.pop){S.pop='';S.q='';shell()}return}
const d=t.dataset;
if(d.th){TH=d.th;document.documentElement.dataset.theme=TH;try{localStorage.setItem('pos-theme',TH)}catch(e){}return shell()}
if(t.id=='mb'){S.mob=!S.mob;return shell()}
if(d.cl){S.cl=d.cl;if(d.g)return go(d.g);return render()}
if(d.g){S.mob=false;return go(d.g)}
if(d.c){S.coll=!S.coll;return shell()}
if(d.h)return toast('Help & Support: demo only');
if(d.p){S.pop=S.pop?'':d.p;return shell()}
if(d.t){S.tab=d.t;return render()}
if(d.at){const[i,s]=d.at.split('|');K[i-1].at=s;if(s=='Absent'){K[i-1].rs='Sick'}toast(K[i-1].n+' marked '+s);return render()}
if(d.fee){K[d.fee-1].fee='Paid';toast('Payment recorded');return render()}
if(d.vf){K[d.vf-1].vf=true;toast('Guardian identity verified');return render()}
if(d.pk){const k=K[d.pk-1];if(!k.vf)return toast('Verify the guardian first');k.pk='Completed';toast(k.n+' picked up safely');return render()}
if(d.ph){PF[d.ph].ok=true;toast('Photo approved — now visible to parent');return render()}
if(t.id=='add')modal('Add Child','<input class="in" id="nm" placeholder="Child name">',m=>{const n=m.querySelector('#nm').value||'New Child';K.push({...K[0],id:K.length+1,n,par:'Parent of '+n});toast(n+' added')||render()});
if(t.id=='ao')modal('Add observation','<select id="oa"><option>Language</option><option>Cognitive</option><option>Motor</option><option>Creativity</option></select><textarea id="ot" rows="3" class="in" placeholder="What did you observe?"></textarea>',m=>{OB.unshift({k:1,a:m.querySelector('#oa').value,t:m.querySelector('#ot').value||'Showed curiosity during play.',act:'Free Play',ev:'Teacher note',d:'Oct 6'});toast('Observation recorded');render()})});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;S.pop='';const h=$('.pop');if(h)h.remove();const r=$('#hd .r');r.insertAdjacentHTML('beforeend',pop())}if(e.target.id=='fq'){S.fq=e.target.value;const p=e.target.selectionStart;render();const f=$('#fq');f.focus();f.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id=='ct'){S.ctr=e.target.value;toast('Switched to Sunshine Kids — '+S.ctr)}});
addEventListener('hashchange',render);render();
</script></body></html>
